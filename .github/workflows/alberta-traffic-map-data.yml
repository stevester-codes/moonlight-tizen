name: Refresh Alberta traffic map data

on:
  push:
    branches: [alberta-traffic-map]
    paths:
      - '.github/workflows/alberta-traffic-map-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alberta-traffic-map
      - name: Download Alberta source data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/abtraffic
          curl -fL --retry 4 --retry-delay 2 'https://www.transportation.alberta.ca/mapping/2025TCS.json' -o /tmp/abtraffic/tcs.json
          curl -fL --retry 4 --retry-delay 2 'https://www.transportation.alberta.ca/mapping/ATRPoints.xml' -o /tmp/abtraffic/atr.xml
          curl -fL --retry 4 --retry-delay 2 'https://www.transportation.alberta.ca/mapping/IntersectionPoints.xml' -o /tmp/abtraffic/intersections.xml
      - name: Build static browser data
        shell: bash
        run: |
          python - <<'PY'
          import json, html, xml.etree.ElementTree as ET
          from pathlib import Path

          t0 = json.loads(Path('/tmp/abtraffic/tcs.json').read_text(encoding='utf-8-sig'))
          t = [[x['id'], x['cs']['hwy'], x['cs']['cs'], x['tcs']['tcs'], x['tcs']['waadt'], x['tcs']['encodedPath']] for x in t0]

          def points(path):
              root = ET.fromstring(Path(path).read_text(encoding='utf-8-sig'))
              out = []
              for n in root.iter('pinfo'):
                  out.append([html.unescape(n.attrib.get('refid','')), float(n.attrib['lat']), float(n.attrib['lng']), html.unescape(n.attrib.get('desc',''))])
              return out

          a = points('/tmp/abtraffic/atr.xml')
          i = points('/tmp/abtraffic/intersections.xml')
          payload = json.dumps([t,a,i], separators=(',', ':'), ensure_ascii=False)
          Path('alberta-traffic-map/data.js').write_text('window.AB_TRAFFIC_DATA=' + payload + ';\n', encoding='utf-8')
          print(f'Built {len(t)} traffic sections, {len(a)} ATRs, {len(i)} intersections')
          PY
      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alberta-traffic-map/data.js
          if git diff --cached --quiet; then
            echo 'Data unchanged.'
            exit 0
          fi
          git commit -m 'Refresh Alberta traffic map data [skip ci]'
          git push origin HEAD:alberta-traffic-map
