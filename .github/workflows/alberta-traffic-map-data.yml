name: Refresh Alberta traffic map data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alberta-traffic-map
      - name: Download latest Alberta source data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/abtraffic
          YEAR=$(date -u +%Y)
          FOUND=''
          for Y in $(seq "$YEAR" -1 $((YEAR-4))); do
            if curl -fsSL --retry 2 --retry-delay 1 "https://www.transportation.alberta.ca/mapping/${Y}TCS.json" -o /tmp/abtraffic/tcs.json; then
              FOUND="$Y"
              break
            fi
          done
          test -n "$FOUND"
          echo "$FOUND" > /tmp/abtraffic/year.txt
          curl -fsSL --retry 4 --retry-delay 2 'https://www.transportation.alberta.ca/mapping/ATRPoints.xml' -o /tmp/abtraffic/atr.xml
          curl -fsSL --retry 4 --retry-delay 2 'https://www.transportation.alberta.ca/mapping/IntersectionPoints.xml' -o /tmp/abtraffic/intersections.xml
      - name: Build static browser geometry
        shell: bash
        run: |
          python - <<'PY'
          import json, html, xml.etree.ElementTree as ET
          from pathlib import Path
          year=Path('/tmp/abtraffic/year.txt').read_text().strip()
          t0=json.loads(Path('/tmp/abtraffic/tcs.json').read_text(encoding='utf-8-sig'))
          t=[[x['id'],x['cs']['hwy'],x['cs']['cs'],x['tcs']['tcs'],x['tcs']['waadt'],x['tcs']['encodedPath']] for x in t0]
          def points(path):
              root=ET.fromstring(Path(path).read_text(encoding='utf-8-sig'))
              return [[html.unescape(n.attrib.get('refid','')),float(n.attrib['lat']),float(n.attrib['lng']),html.unescape(n.attrib.get('desc',''))] for n in root.iter('pinfo')]
          a=points('/tmp/abtraffic/atr.xml'); i=points('/tmp/abtraffic/intersections.xml')
          payload=json.dumps([t,a,i],separators=(',',':'),ensure_ascii=False)
          Path('alberta-traffic-map/data.js').write_text(f'window.AB_TRAFFIC_YEAR={year};window.AB_TRAFFIC_DATA='+payload+';\n',encoding='utf-8')
          print(f'Built Alberta {year}: {len(t)} traffic sections, {len(a)} ATRs, {len(i)} intersections')
          PY
      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alberta-traffic-map/data.js
          if git diff --cached --quiet; then echo 'Data unchanged.'; exit 0; fi
          git commit -m 'Refresh Alberta traffic map data'
          git push origin HEAD:alberta-traffic-map
