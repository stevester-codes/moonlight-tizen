<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes"><title>Alberta Traffic Data Map</title>
<link rel="stylesheet" href="./leaflet.css">
<style>
:root{--fg:#17202a;--muted:#657386;--border:#d6dde5;--red:#d62828;--blue:#1769aa;--purple:#6b3fa0}*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--fg);overflow:hidden}#map{background:#e7ebef}.panel{position:absolute;z-index:1100;top:12px;left:12px;width:min(390px,calc(100vw - 24px));background:#fffffff8;border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 20px #0002;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border)}.head h1{font-size:15px;margin:0}.headBtns{display:flex;gap:5px}.head button,.go{border:1px solid #aeb8c4;background:#fff;border-radius:6px;cursor:pointer}.head button{height:28px;padding:0 8px}.head #collapse{font-size:19px;width:30px}.body{padding:10px 12px;max-height:calc(100vh - 68px);overflow:auto}.row{display:flex;gap:6px}#search{width:100%;padding:9px;border:1px solid #aeb8c4;border-radius:6px}.go{padding:8px 10px}.layers{margin-top:10px;border:1px solid var(--border);border-radius:7px;padding:8px 9px}.layers strong{font-size:13px}.layers label{display:block;margin:5px 0;font-size:13px}.small,.hint{font-size:11px;color:var(--muted);line-height:1.4}.hint{margin-top:6px}.status{font-size:12px;margin-top:8px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#475569}.sw{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}.red{background:var(--red)}.blue{background:var(--blue);border-radius:50%}.purple{background:var(--purple)}#details{margin-top:9px;border-top:1px solid var(--border);padding-top:9px}#details:empty{display:none}.title{font-weight:700;font-size:15px;margin-bottom:3px}.desc{font-size:12px;color:#475569;margin-bottom:8px}.btn{display:inline-block;text-decoration:none;color:#0b57d0;background:#f8fafc;border:1px solid #bdc7d3;border-radius:5px;padding:5px 7px;margin:2px 3px 2px 0;font-size:12px}.btn.primary{font-weight:700;background:#eef6ff}.yrow{border-top:1px solid #edf0f3;padding:6px 0;font-size:12px}.year{display:inline-block;width:46px;font-weight:700}.count-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 5px;border-radius:10px;background:#eaf7ee;color:#176b38;margin-right:4px}.section{font-size:12px;font-weight:700;margin:9px 0 3px}.grid{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px;margin:6px 0}.grid b{color:#475569}.ok{color:#176b38}.warn{color:#8a5b00}.spinner{display:inline-block;width:10px;height:10px;border:2px solid #c5ccd5;border-top-color:#51606f;border-radius:50%;animation:s 1s linear infinite;vertical-align:-1px;margin-right:5px}@keyframes s{to{transform:rotate(360deg)}}.hidden{display:none}.leaflet-tooltip.marker-label{font-size:10px;font-weight:600;color:#111;background:#fffddd;border:1px solid #888;border-radius:3px;padding:1px 3px;box-shadow:none}.note{margin-top:9px;padding-top:7px;border-top:1px solid var(--border);font-size:10.5px;color:#6b7280;line-height:1.35}@media(max-width:650px){.panel{top:8px;left:8px;width:calc(100vw - 16px)}.body{max-height:55vh}}
</style></head><body><div id="map"></div><div class="panel"><div class="head"><h1>Alberta Traffic Data Map</h1><div class="headBtns"><button id="home">Alberta</button><button id="collapse">−</button></div></div><div class="body" id="panelBody"><div class="row"><input id="search" placeholder="Count ID, ATR, highway or place"><button class="go" id="go">Search</button></div><div class="layers"><strong>Layers</strong><label><input id="ltcs" type="checkbox" checked> Traffic Control Sections</label><label><input id="latr" type="checkbox" checked> Automated Traffic Recorders</label><label><input id="lint" type="checkbox" checked> Intersections / count locations</label><div class="hint">Traffic sections appear at zoom 9; point layers at zoom 11.</div></div><div class="legend"><span><i class="sw red"></i>Traffic section</span><span><i class="sw blue"></i>ATR</span><span><i class="sw purple"></i>Intersection</span></div><div id="status" class="status"></div><div id="details"></div><div class="note">Unofficial viewer of Alberta Transportation data. Report buttons open the official Alberta files directly. No third-party CORS proxy is used.</div></div></div>
<script src="./leaflet.js"></script><script src="./meta.js"></script><script src="./data.js"></script><script>
'use strict';
const BASE='https://www.transportation.alberta.ca/mapping/',$=id=>document.getElementById(id),status=$('status'),details=$('details'),pad8=v=>String(v).padStart(8,'0'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DATA_YEAR=window.AB_TRAFFIC_YEAR||new Date().getFullYear();const [TCS,ATR,INTS]=window.AB_TRAFFIC_DATA||[[],[],[]];let map,tg=L.layerGroup(),ag=L.layerGroup(),ig=L.layerGroup(),renderer,tLayers=[],aLayers=[],iLayers=[],tVis=false,aVis=false,iVis=false;const probeCache=new Map();
map=L.map('map',{center:[54.15,-114.4],zoom:6,zoomControl:false,preferCanvas:true,scrollWheelZoom:true,doubleClickZoom:true,dragging:true,touchZoom:true});L.control.zoom({position:'bottomright'}).addTo(map);L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);renderer=L.canvas({padding:.5});
function decodePolyline(str,p=5){let i=0,lat=0,lng=0,o=[],f=10**p;while(i<str.length){let r=0,s=0,b;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);r=0;s=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);o.push([lat/f,lng/f])}return o}
TCS.forEach((s,i)=>{const w=+s[4]||0,l=L.polyline(decodePolyline(s[5]),{renderer,color:'#d62828',opacity:.42,weight:(w>1000&&w<19500)?6:Math.max(3,3+Math.floor(w/188500*29))});l.bindTooltip(`Hwy ${esc(s[1])} · ${Number(w).toLocaleString()} WAADT`,{sticky:true});l.on('mouseover',()=>l.setStyle({opacity:1}));l.on('mouseout',()=>l.setStyle({opacity:.42}));l.on('click',()=>showTCS(i));l.addTo(tg);tLayers.push(l)});
function mkPoint(p,kind,i){const color=kind==='atr'?'#1769aa':'#6b3fa0',m=L.circleMarker([p[1],p[2]],{renderer,radius:kind==='atr'?5:4,weight:1,color,fillColor:color,fillOpacity:.88});m.bindTooltip(esc(p[0]),{direction:'top',className:'marker-label'});m.on('click',()=>kind==='atr'?showATR(i):showINT(i));return m}ATR.forEach((p,i)=>{const m=mkPoint(p,'atr',i);m.addTo(ag);aLayers.push(m)});INTS.forEach((p,i)=>{const m=mkPoint(p,'int',i);m.addTo(ig);iLayers.push(m)});
function update(){const z=map.getZoom(),wt=$('ltcs').checked&&z>=9,wa=$('latr').checked&&z>=11,wi=$('lint').checked&&z>=11;if(wt&&!tVis){tg.addTo(map);tVis=true}if(!wt&&tVis){map.removeLayer(tg);tVis=false}if(wa&&!aVis){ag.addTo(map);aVis=true}if(!wa&&aVis){map.removeLayer(ag);aVis=false}if(wi&&!iVis){ig.addTo(map);iVis=true}if(!wi&&iVis){map.removeLayer(ig);iVis=false}}map.on('zoomend',update);['ltcs','latr','lint'].forEach(id=>$(id).addEventListener('change',update));update();status.innerHTML=`<span class="ok">Data ready:</span> ${TCS.length.toLocaleString()} traffic sections, ${ATR.length.toLocaleString()} ATRs, ${INTS.length.toLocaleString()} intersections · Alberta source year ${DATA_YEAR}.`;
const report=(y,id)=>`${BASE}${y}/TM/${pad8(id)}.pdf`,raw=(y,id)=>`${BASE}${y}/Raw/${pad8(id)}.xls`,diagram=(y,id)=>`${BASE}${y}/Diagram/${pad8(id)}.jpg`;
function focus(m,z=14){map.setView(m.getLatLng(),Math.max(z,map.getZoom()));setTimeout(update,0)}
function imageExists(url,timeout=5000){return new Promise(resolve=>{const im=new Image();let done=false;const finish=v=>{if(done)return;done=true;clearTimeout(to);im.onload=im.onerror=null;resolve(v)};const to=setTimeout(()=>finish(false),timeout);im.onload=()=>finish(true);im.onerror=()=>finish(false);im.referrerPolicy='no-referrer';im.src=url+(url.includes('?')?'&':'?')+'cb='+Date.now()})}
async function probeCountYears(id){const key=String(id);if(probeCache.has(key))return probeCache.get(key);const years=[];for(let y=DATA_YEAR;y>=2002;y--)years.push(y);const checks=await Promise.all(years.map(async y=>[y,await imageExists(diagram(y,id),3500)]));const found=checks.filter(x=>x[1]).map(x=>x[0]);probeCache.set(key,found);return found}
function annualRows(id){let h='';for(let y=DATA_YEAR;y>=2002;y--)h+=`<div class="yrow"><span class="year">${y}</span><a class="btn" target="_blank" rel="noopener" href="${report(y,id)}">Traffic report PDF</a></div>`;return h}
async function showINT(i){const p=INTS[i],id=p[0],m=iLayers[i],token=Math.random().toString(36).slice(2),idx=BASE+pad8(id)+'.xml';focus(m);details.dataset.token=token;details.innerHTML=`<div class="title">Count location ${esc(id)}</div><div class="desc">${esc(p[3])}</div><a class="btn primary" target="_blank" rel="noopener" href="${report(DATA_YEAR,id)}">Latest traffic report (${DATA_YEAR})</a><a class="btn" target="_blank" rel="noopener" href="${idx}">Official Alberta index</a><div class="section">Actual counted years</div><div id="countYears"><span class="spinner"></span><span class="small">Checking Alberta's official diagram files live…</span></div><details><summary class="section" style="cursor:pointer">Annual traffic reports</summary>${annualRows(id)}</details>`;const years=await probeCountYears(id);if(details.dataset.token!==token)return;const box=document.getElementById('countYears');if(!box)return;if(!years.length){box.innerHTML='<div class="small warn">No diagram files were detected. Use the official Alberta index button above.</div>';return}box.innerHTML=years.map(y=>`<div class="yrow"><span class="year">${y}</span><span class="count-badge">COUNT</span><a class="btn" target="_blank" rel="noopener" href="${report(y,id)}">Report PDF</a><a class="btn" target="_blank" rel="noopener" href="${raw(y,id)}">Raw XLS</a><a class="btn" target="_blank" rel="noopener" href="${diagram(y,id)}">Diagram JPG</a></div>`).join('')+'<div class="small">Count years are detected live from official Alberta diagram files. The exact count date remains available in the official XML index.</div>'}
function showATR(i){const p=ATR[i],id=p[0];focus(aLayers[i]);details.dataset.token='atr'+i;details.innerHTML=`<div class="title">ATR ${esc(id)}</div><div class="desc">${esc(p[3])}</div><a class="btn primary" target="_blank" rel="noopener" href="${BASE}TenYearHistorical/${encodeURIComponent(id)}.xlsx">Ten Year Historical Report</a><a class="btn" target="_blank" rel="noopener" href="${BASE}${encodeURIComponent(id)}.xml">Official Alberta station index</a><div class="small" style="margin-top:6px">These links go directly to Alberta Transportation and therefore always use the current official files.</div>`}
function showTCS(i){const s=TCS[i];details.dataset.token='t'+i;details.innerHTML=`<div class="title">Highway ${esc(s[1])} — Traffic Control Section</div><div class="grid"><b>Control section</b><span>${String(s[2]).padStart(2,'0')}</span><b>Traffic section</b><span>${String(s[3]).padStart(2,'0')}</span><b>WAADT</b><span>${Number(s[4]).toLocaleString()}</span></div><a class="btn" target="_blank" rel="noopener" href="${BASE}TCS/${encodeURIComponent(s[0])}.json">Official Alberta section JSON</a>`}
function norm(s){return String(s||'').trim().toLowerCase()}function local(q){const nq=norm(q),digits=q.replace(/\D/g,'');if(digits){let i=INTS.findIndex(p=>String(p[0])===digits||pad8(p[0])===digits.padStart(8,'0'));if(i>=0)return['i',i];i=ATR.findIndex(p=>norm(p[0])===nq);if(i>=0)return['a',i]}let i=ATR.findIndex(p=>norm(p[3]).includes(nq)||norm(p[0]).includes(nq));if(i>=0)return['a',i];i=INTS.findIndex(p=>norm(p[3]).includes(nq)||norm(p[0]).includes(nq));if(i>=0)return['i',i];const h=nq.replace(/^hwy\s*/,'').replace(/^highway\s*/,'');i=TCS.findIndex(s=>norm(s[1])===h);if(i>=0)return['t',i];return null}
async function search(){const q=$('search').value.trim();if(!q)return;const h=local(q);if(h){if(h[0]==='i')showINT(h[1]);else if(h[0]==='a')showATR(h[1]);else{const l=tLayers[h[1]];map.fitBounds(l.getBounds(),{maxZoom:13});setTimeout(update,0);showTCS(h[1])}status.textContent='Found in Alberta traffic data.';return}try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ca&q='+encodeURIComponent(q+', Alberta'));const a=await r.json();if(a[0]){map.setView([+a[0].lat,+a[0].lon],13);status.textContent='Place found.';return}}catch(e){}status.textContent='No match found.'}
$('go').onclick=search;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('home').onclick=()=>{map.setView([54.15,-114.4],6);details.innerHTML=''};$('collapse').onclick=()=>{const b=$('panelBody'),x=b.classList.toggle('hidden');$('collapse').textContent=x?'+':'−';setTimeout(()=>map.invalidateSize(),50)};setTimeout(()=>map.invalidateSize(true),100);
</script></body></html>
